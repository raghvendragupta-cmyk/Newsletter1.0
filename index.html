<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ownly Interactive Newspaper</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      background-color: #121212;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: Arial, sans-serif;
    }

    .header-bar {
      margin-bottom: 20px;
      color: #ffffff;
      text-align: center;
    }

    .header-bar h1 {
      font-size: 22px;
      color: #FF2E93;
    }

    .flipbook-wrapper {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #flipbook {
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      display: none;
    }

    .page {
      background-color: #ffffff;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .page img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .controls {
      margin-top: 25px;
      display: flex;
      gap: 15px;
    }

    .btn {
      background: #FF2E93;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn:hover { background: #D9006C; }
  </style>
</head>
<body>

  <div class="header-bar">
    <h1>📰 Ownly Interactive Newspaper</h1>
  </div>

  <div class="flipbook-wrapper">
    <div id="flipbook">
      <div class="page"><img src="Page 1.png" alt="Page 1"></div>
      <div class="page"><img src="page 2.png" alt="Page 2"></div>
      <div class="page"><img src="page 3.png" alt="Page 3"></div>
      <div class="page"><img src="Page 4.png" alt="Page 4"></div>
    </div>
  </div>

  <div class="controls">
    <button class="btn" id="prevBtn">← Previous Page</button>
    <button class="btn" id="nextBtn">Next Page →</button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/page-flip/build/js/page-flip.browser.js"></script>

  <script>
    function playPageTurnSound() {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const bufferSize = audioCtx.sampleRate * 0.15;
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        
        for (let i = 0; i < bufferSize; i++) {
          data[i] = Math.random() * 2 - 1;
        }

        const noise = audioCtx.createBufferSource();
        noise.buffer = buffer;

        const filter = audioCtx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.value = 800;

        const gain = audioCtx.createGain();
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);

        noise.connect(filter);
        filter.connect(gain);
        gain.connect(audioCtx.destination);

        noise.start();
      } catch (e) {}
    }

    window.addEventListener('load', () => {
      const flipbookEl = document.getElementById('flipbook');
      
      const pageFlip = new St.PageFlip(flipbookEl, {
        width: 400,
        height: 550,
        size: "fixed",
        minWidth: 300,
        maxWidth: 1000,
        minHeight: 400,
        maxHeight: 1200,
        maxShadowOpacity: 0.5,
        showCover: true
      });

      pageFlip.loadFromHTML(document.querySelectorAll('.page'));
      flipbookEl.style.display = 'block';

      pageFlip.on('flip', () => {
        playPageTurnSound();
      });

      document.getElementById('prevBtn').addEventListener('click', () => pageFlip.flipPrev());
      document.getElementById('nextBtn').addEventListener('click', () => pageFlip.flipNext());
    });
  </script>

</body>
</html>
