<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ownly Newsletter</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html { width: 100%; height: 100%; overflow: hidden; background-color: #121212; font-family: Arial, sans-serif; }

    /* Interactive Scooter Overlay */
    #intro-overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: #121212;
      z-index: 9999;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: opacity 0.8s ease, visibility 0.8s;
    }

    .scooter-container {
      position: absolute;
      bottom: 25%;
      left: -350px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: driveToCenter 2.5s cubic-bezier(0.25, 1, 0.5, 1) forwards;
    }

    .banner-prompt {
      background: #FF2E93;
      color: #ffffff;
      padding: 14px 28px;
      border-radius: 30px;
      font-weight: bold;
      font-size: 18px;
      box-shadow: 0 0 25px rgba(255, 46, 147, 0.8);
      margin-bottom: 15px;
      animation: floatBanner 1.5s ease-in-out infinite alternate;
      border: 2px solid #ffffff;
      text-align: center;
    }

    /* CSS Vector Character */
    .scooter-graphic {
      position: relative;
      width: 180px;
      height: 140px;
    }

    .rider-helmet {
      position: absolute;
      top: 0; left: 65px;
      width: 45px; height: 40px;
      background: #FF2E93;
      border-radius: 25px 25px 10px 10px;
      border: 3px solid #fff;
    }

    .rider-body {
      position: absolute;
      top: 38px; left: 60px;
      width: 55px; height: 50px;
      background: #FF2E93;
      border-radius: 15px 15px 0 0;
      color: #fff;
      font-weight: bold;
      font-size: 11px;
      display: flex;
      justify-content: center;
      align-items: center;
      border: 2px solid #fff;
    }

    .scooter-body {
      position: absolute;
      bottom: 25px; left: 20px;
      width: 140px; height: 35px;
      background: #FFD700;
      border-radius: 20px 40px 10px 10px;
    }

    .wheel {
      position: absolute;
      bottom: 10px;
      width: 35px; height: 35px;
      background: #333;
      border: 4px solid #aaa;
      border-radius: 50%;
    }
    .wheel.left { left: 25px; }
    .wheel.right { right: 25px; }

    /* Main Iframe */
    #flipbook-frame {
      width: 100%;
      height: 100vh;
      border: none;
    }

    /* Pink Ownly Logo Patch (Shifted higher and wider to fully cover watermark) */
    .brand-overlay-patch {
      position: fixed;
      bottom: 85px;
      left: 45px;
      z-index: 999;
      background-color: #FF2E93;
      color: #ffffff;
      padding: 16px 24px;
      border-radius: 16px;
      font-weight: 800;
      font-size: 18px;
      letter-spacing: 0.5px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
      border: 3px solid #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 240px;
      height: 85px;
      pointer-events: none;
    }

    @keyframes driveToCenter {
      0% { left: -350px; }
      100% { left: calc(50% - 90px); }
    }

    @keyframes floatBanner {
      0% { transform: translateY(0px) scale(1); }
      100% { transform: translateY(-10px) scale(1.05); }
    }
  </style>
</head>
<body>

  <!-- Scooter Intro -->
  <div id="intro-overlay">
    <div class="scooter-container" id="scooterButton">
      <div class="banner-prompt">📰 Click to Read Ownly Newsletter!</div>
      
      <div class="scooter-graphic">
        <div class="rider-helmet"></div>
        <div class="rider-body">OWNLY</div>
        <div class="scooter-body"></div>
        <div class="wheel left"></div>
        <div class="wheel right"></div>
      </div>
    </div>
  </div>

  <!-- Embedded Flipbook -->
  <iframe id="flipbook-frame" src="https://heyzine.com/flip-book/0e74665815.html#page/4" allowfullscreen></iframe>

  <!-- Pink Ownly Branding Cover -->
  <div class="brand-overlay-patch">
    <span>📰</span> OWNLY
  </div>

  <script>
    const scooterBtn = document.getElementById('scooterButton');
    const overlay = document.getElementById('intro-overlay');

    scooterBtn.addEventListener('click', () => {
      overlay.style.opacity = '0';
      overlay.style.visibility = 'hidden';
    });
  </script>

</body>
</html>
