<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ownly Interactive Newspaper</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      background-color: #121212;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    .header-bar {
      margin-bottom: 15px;
      color: #ffffff;
      text-align: center;
    }

    .header-bar h1 {
      font-size: 22px;
      color: #FF2E93;
    }

    .flipbook-wrapper {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #flipbook-container {
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
    }

    .controls {
      margin-top: 20px;
      display: flex;
      gap: 15px;
    }

    .btn {
      background: #FF2E93;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn:hover { background: #D9006C; }
  </style>
</head>
<body>

  <div class="header-bar">
    <h1>📰 Ownly Interactive Newspaper</h1>
  </div>

  <div class="flipbook-wrapper">
    <div id="flipbook-container"></div>
  </div>

  <div class="controls">
    <button class="btn" id="prevBtn">← Previous Page</button>
    <button class="btn" id="nextBtn">Next Page →</button>
  </div>

  <!-- StPageFlip Engine -->
  <script src="https://cdn.jsdelivr.net/npm/page-flip/build/js/page-flip.browser.js"></script>

  <script>
    // Audio synthesizer for realistic page turn sound
    function playPageTurnSound() {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const bufferSize = audioCtx.sampleRate * 0.15;
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        
        for (let i = 0; i < bufferSize; i++) {
          data[i] = Math.random() * 2 - 1;
        }

        const noise = audioCtx.createBufferSource();
        noise.buffer = buffer;

        const filter = audioCtx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.value = 800;

        const gain = audioCtx.createGain();
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);

        noise.connect(filter);
        filter.connect(gain);
        gain.connect(audioCtx.destination);

        noise.start();
      } catch (e) {
        // Audio fallback
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      const container = document.getElementById('flipbook-container');

      // Initialize StPageFlip
      const pageFlip = new St.PageFlip(container, {
        width: 450,
        height: 600,
        size: "fixed",
        showCover: true,
        maxShadowOpacity: 0.6
      });

      // EXACT FILENAMES MATCHING YOUR UPLOADED SCREENSHOTS
      const canvaScreenshots = [
        'Page 1.png',
        'page 2.png',
        'page 3.png',
        'Page 4.png'
      ];

      // Load images directly
      pageFlip.loadFromImages(canvaScreenshots);

      // Trigger audio on page turn
      pageFlip.on('flip', () => {
        playPageTurnSound();
      });

      // Navigation buttons
      document.getElementById('prevBtn').addEventListener('click', () => pageFlip.flipPrev());
      document.getElementById('nextBtn').addEventListener('click', () => pageFlip.flipNext());
    });
  </script>

</body>
</html>
