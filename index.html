<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ownly Newsletter</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html { 
      width: 100%; 
      height: 100%; 
      overflow: hidden; 
      background-color: #0c0c0c; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
    }

    /* Fullscreen High-Zoom Flipbook Wrapper */
    .iframe-wrapper {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #flipbook-frame {
      width: 140vw; 
      height: 140vh; 
      border: none;
      transform: scale(1.45);
      transform-origin: center center;
    }

    /* Interactive Overlay */
    #intro-overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: #0c0c0c;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 40px 0;
      transition: opacity 0.8s ease, visibility 0.8s;
      cursor: pointer;
    }

    /* Delivery Stage Environment */
    .delivery-stage {
      width: 100%;
      height: 60vh;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: flex-end;
    }

    /* Buildings */
    .building {
      position: absolute;
      bottom: 50px;
      z-index: 2;
    }

    .restaurant {
      left: 5%;
    }

    .home {
      right: 5%;
    }

    /* Road Track */
    .road {
      position: absolute;
      bottom: 0;
      width: 100%;
      height: 50px;
      background: #1a1a1a;
      border-top: 3px solid #ff3385;
      display: flex;
      align-items: center;
      justify-content: space-around;
    }

    .road-line {
      width: 40px;
      height: 6px;
      background: #444;
      border-radius: 3px;
    }

    /* Moving Scooter Assembly */
    .scooter-delivery-unit {
      position: absolute;
      bottom: 35px;
      left: -400px;
      z-index: 10;
      display: flex;
      align-items: center;
      animation: deliveryRoute 8s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
    }

    .waving-banner {
      background: linear-gradient(135deg, #ff3385, #ff6a00);
      color: #fff;
      font-weight: 800;
      font-size: 16px;
      padding: 10px 20px;
      border-radius: 8px;
      border: 2px solid #fff;
      box-shadow: 0 4px 15px rgba(255, 51, 133, 0.6);
      white-space: nowrap;
      margin-right: -15px;
      transform-origin: right center;
      animation: bannerWave 1.2s ease-in-out infinite alternate;
      position: relative;
    }

    .waving-banner::after {
      content: '';
      position: absolute;
      right: -15px;
      top: 50%;
      width: 15px;
      height: 2px;
      background: #fff;
    }

    .scooter-svg {
      width: 220px;
      height: 160px;
      filter: drop-shadow(0 10px 15px rgba(0,0,0,0.5));
    }

    /* Prompts */
    .prompt-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      z-index: 20;
    }

    .banner-prompt {
      background: linear-gradient(135deg, #FF3385 0%, #FF6A00 100%);
      color: #ffffff;
      padding: 16px 40px;
      border-radius: 50px;
      font-weight: 800;
      font-size: 20px;
      letter-spacing: 0.5px;
      box-shadow: 0 10px 40px rgba(255, 51, 133, 0.8), inset 0 2px 3px rgba(255,255,255,0.3);
      border: 3px solid #ffffff;
      text-align: center;
      white-space: nowrap;
      animation: realismFloat 2s ease-in-out infinite alternate;
      text-transform: uppercase;
    }

    .sub-prompt {
      color: #bbbbbb;
      font-size: 14px;
      letter-spacing: 1px;
      font-weight: 400;
    }

    /* Floating Feedback Button */
    .feedback-btn {
      position: fixed;
      bottom: 25px;
      right: 25px;
      z-index: 999;
      background: #FF3385;
      color: #ffffff;
      padding: 12px 22px;
      border-radius: 30px;
      font-weight: bold;
      font-size: 15px;
      text-decoration: none;
      box-shadow: 0 4px 20px rgba(255, 51, 133, 0.6);
      border: 2px solid #ffffff;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .feedback-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 6px 25px rgba(255, 51, 133, 0.9);
    }

    /* Keyframe Animations */
    @keyframes deliveryRoute {
      0% { left: -350px; transform: scaleX(1); }
      45% { left: calc(100% - 300px); transform: scaleX(1); }
      50% { left: calc(100% - 300px); transform: scaleX(-1); }
      95% { left: -350px; transform: scaleX(-1); }
      100% { left: -350px; transform: scaleX(1); }
    }

    @keyframes bannerWave {
      0% { transform: rotate(-3deg) translateY(0px); }
      100% { transform: rotate(3deg) translateY(-4px); }
    }

    @keyframes realismFloat {
      0% { transform: translateY(0px) scale(1); box-shadow: 0 10px 40px rgba(255, 51, 133, 0.8); }
      100% { transform: translateY(-10px) scale(1.03); box-shadow: 0 15px 50px rgba(255, 51, 133, 0.9); }
    }
  </style>
</head>
<body>

  <!-- Scooter Delivery Intro Overlay -->
  <div id="intro-overlay">
    
    <div class="delivery-stage">
      <!-- Restaurant Building -->
      <svg class="building restaurant" width="120" height="140" viewBox="0 0 120 140">
        <rect x="10" y="30" width="100" height="110" fill="#222" stroke="#ff3385" stroke-width="2" rx="5"/>
        <path d="M5 30 L60 5 L115 30 Z" fill="#ff3385"/>
        <rect x="35" y="80" width="50" height="60" fill="#111" stroke="#fff" stroke-width="1"/>
        <text x="60" y="22" text-anchor="middle" fill="#fff" font-size="10" font-weight="bold">RESTAURANT</text>
        <circle cx="60" cy="55" r="12" fill="#ffeb3b"/>
        <text x="60" y="59" text-anchor="middle" fill="#000" font-size="12">🍔</text>
      </svg>

      <!-- Customer Home Building -->
      <svg class="building home" width="110" height="130" viewBox="0 0 110 130">
        <path d="M10 50 L55 10 L100 50 Z" fill="#ff6a00"/>
        <rect x="15" y="50" width="80" height="80" fill="#222" stroke="#ff6a00" stroke-width="2"/>
        <rect x="42" y="85" width="26" height="45" fill="#444"/>
        <rect x="25" y="65" width="20" height="20" fill="#ffeb3b" opacity="0.8"/>
        <rect x="65" y="65" width="20" height="20" fill="#ffeb3b" opacity="0.8"/>
        <text x="55" y="125" text-anchor="middle" fill="#fff" font-size="9" font-weight="bold">HOME</text>
      </svg>

      <!-- Moving Delivery Unit -->
      <div class="scooter-delivery-unit">
        <div class="waving-banner">OWNLY NEWSLETTER</div>
        <svg class="scooter-svg" viewBox="0 0 300 200">
          <ellipse cx="150" cy="175" rx="90" ry="10" fill="rgba(0,0,0,0.4)"/>
          <circle cx="80" cy="150" r="25" fill="#111" stroke="#444" stroke-width="6"/>
          <circle cx="80" cy="150" r="10" fill="#888"/>
          <circle cx="220" cy="150" r="25" fill="#111" stroke="#444" stroke-width="6"/>
          <circle cx="220" cy="150" r="10" fill="#888"/>
          <path d="M70 145 C70 110 120 100 160 120 L210 120 C230 120 235 145 220 150 L100 155 Z" fill="#ffeb3b" stroke="#fbc02d" stroke-width="2"/>
          <path d="M90 110 L110 70 L150 70" fill="none" stroke="#333" stroke-width="6" stroke-linecap="round"/>
          <path d="M120 100 L180 100 L180 115 L120 115 Z" fill="#222"/>
          <rect x="35" y="70" width="55" height="55" rx="6" fill="#ff3385" stroke="#fff" stroke-width="2"/>
          <text x="62" y="102" text-anchor="middle" fill="#fff" font-family="Arial" font-weight="bold" font-size="10">OWNLY</text>
          <path d="M150 70 C150 50 165 40 170 40 C180 40 185 55 185 70 L150 95 Z" fill="#ff3385"/>
          <circle cx="175" cy="28" r="14" fill="#ff3385"/>
          <circle cx="175" cy="28" r="12" fill="#333"/>
          <path d="M175 28 L187 28" stroke="#ffeb3b" stroke-width="3"/>
          <circle cx="178" cy="28" r="3" fill="#ffcc80"/>
          <path d="M150 50 L125 60" stroke="#ff3385" stroke-width="8" stroke-linecap="round"/>
          <path d="M125 60 L110 68" stroke="#ffcc80" stroke-width="6" stroke-linecap="round"/>
          <circle cx="215" cy="85" r="10" fill="#fff" stroke="#ffeb3b" stroke-width="2"/>
        </svg>
      </div>

      <!-- Road Base -->
      <div class="road">
        <div class="road-line"></div>
        <div class="road-line"></div>
        <div class="road-line"></div>
        <div class="road-line"></div>
        <div class="road-line"></div>
      </div>
    </div>

    <!-- Action Button Prompt -->
    <div class="prompt-box">
      <div class="banner-prompt">Enter Newsletter</div>
      <div class="sub-prompt">Click anywhere to reveal the interactive edition</div>
    </div>

  </div>

  <!-- Max-Zoomed Flipbook Container -->
  <div class="iframe-wrapper">
    <iframe id="flipbook-frame" src="https://heyzine.com/flip-book/f2183c8788.html?page=1" allowfullscreen></iframe>
  </div>

  <!-- Floating Feedback Button -->
  <a href="https://docs.google.com/forms/d/e/1FAIpQLSd79x7zS1NlU-5eyI_v21SdrySaUCoaSSpfINgQ_tJCxJC9Bw/viewform?usp=header" target="_blank" class="feedback-btn">
    💬 Give Feedback
  </a>

  <script>
    const overlay = document.getElementById('intro-overlay');

    overlay.addEventListener('click', () => {
      overlay.style.opacity = '0';
      overlay.style.visibility = 'hidden';
    });
  </script>

</body>
</html>
