<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ownly Newsletter</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html { width: 100%; height: 100%; overflow: hidden; background-color: #121212; font-family: Arial, sans-serif; }

    /* Fullscreen Overlay Screen */
    #intro-overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(18, 18, 18, 0.95);
      z-index: 9999;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: opacity 0.8s ease, visibility 0.8s;
    }

    /* Scooter Character Wrapper & Drive Animation */
    .scooter-container {
      position: absolute;
      bottom: 10%;
      left: -450px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: driveToCenter 2.5s cubic-bezier(0.25, 1, 0.5, 1) forwards;
    }

    /* Click Prompt Overlay Above Rider */
    .banner-prompt {
      background: #FF3385;
      color: #ffffff;
      padding: 12px 24px;
      border-radius: 30px;
      font-weight: bold;
      font-size: 18px;
      box-shadow: 0 0 25px rgba(255, 51, 133, 0.9);
      margin-bottom: 10px;
      animation: floatBanner 1.5s ease-in-out infinite alternate;
      border: 2px solid #ffffff;
      text-align: center;
    }

    /* Scooter Image Styling */
    .scooter-img {
      width: 380px;
      height: auto;
      filter: drop-shadow(0 15px 25px rgba(0,0,0,0.6));
    }

    /* Embedded Heyzine Frame */
    #flipbook-frame {
      width: 100%;
      height: 100vh;
      border: none;
    }

    /* Soft Pink Ownly Logo Patch (Covers Heyzine Watermark) */
    .brand-overlay-patch {
      position: fixed;
      bottom: 50px;
      left: 15px;
      z-index: 999;
      background-color: #FF3385;
      color: #ffffff;
      padding: 16px;
      border-radius: 20px;
      font-weight: 800;
      font-size: 20px;
      letter-spacing: 1px;
      box-shadow: 0 6px 25px rgba(0, 0, 0, 0.7);
      border: 3px solid #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 280px;
      height: 110px;
      pointer-events: none;
    }

    /* Drive into center of screen */
    @keyframes driveToCenter {
      0% { left: -450px; }
      100% { left: calc(50% - 190px); }
    }

    /* Gentle floating effect while waiting for click */
    @keyframes floatBanner {
      0% { transform: translateY(0px) scale(1); }
      100% { transform: translateY(-8px) scale(1.03); }
    }
  </style>
</head>
<body>

  <!-- Interactive Scooter Intro Overlay -->
  <div id="intro-overlay">
    <div class="scooter-container" id="scooterButton">
      <div class="banner-prompt">📰 Click to Read Ownly Newsletter!</div>
      <img src="scooter-man.png" alt="Ownly Scooter Delivery" class="scooter-img">
    </div>
  </div>

  <!-- Embedded Flipbook -->
  <iframe id="flipbook-frame" src="https://heyzine.com/flip-book/0e74665815.html#page/4" allowfullscreen></iframe>

  <!-- Soft Pink Ownly Branding Cover -->
  <div class="brand-overlay-patch">
    <span>📰</span> OWNLY
  </div>

  <script>
    const scooterBtn = document.getElementById('scooterButton');
    const overlay = document.getElementById('intro-overlay');

    scooterBtn.addEventListener('click', () => {
      overlay.style.opacity = '0';
      overlay.style.visibility = 'hidden';
    });
  </script>

</body>
</html>
